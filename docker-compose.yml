version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: subhadarshini_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: subhadarshini_db

  redis:
    image: redis:7-alpine
    container_name: subhadarshini_redis
    restart: always
    ports:
      - "6379:6379"

  backend1:
    build: ./backend
    container_name: subhadarshini_backend_1
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/subhadarshini_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=subhadarshini_jwt_super_secret_key_2026_production
    depends_on:
      - mongodb
      - redis

  backend2:
    build: ./backend
    container_name: subhadarshini_backend_2
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/subhadarshini_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=subhadarshini_jwt_super_secret_key_2026_production
    depends_on:
      - mongodb
      - redis

  backend3:
    build: ./backend
    container_name: subhadarshini_backend_3
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/subhadarshini_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=subhadarshini_jwt_super_secret_key_2026_production
    depends_on:
      - mongodb
      - redis

  frontend:
    build: ./frontend
    container_name: subhadarshini_frontend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: subhadarshini_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
      - frontend

volumes:
  mongo_data:
